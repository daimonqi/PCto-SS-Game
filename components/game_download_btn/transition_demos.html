<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Transition Animation Demos</title>
    <!-- 引入全局样式 -->
    <link rel="stylesheet" href="../../index.css">
    <!-- 引入按钮组件样式 -->
    <link rel="stylesheet" href="game_download_btn.css">
    <style>
        body {
            padding: 40px;
            background-color: #101017;
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .demo-container {
            width: 100%;
            max-width: 600px;
            text-align: center;
        }

        .section-title {
            color: rgba(255, 255, 255, 0.9);
            font-size: 24px;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .section-desc {
            color: rgba(255, 255, 255, 0.5);
            font-size: 14px;
            margin-bottom: 48px;
        }

        .back-link {
            position: absolute;
            top: 40px;
            left: 40px;
            color: #FF7210;
            text-decoration: none;
            font-size: 14px;
            transition: opacity 0.2s;
        }
        .back-link:hover {
            opacity: 0.8;
            text-decoration: underline;
        }

        /* ---------------------------------------------------
           过渡动效 (Transition Demo)
           --------------------------------------------------- */
        .btn-transition-wrapper {
            margin: 0 auto; /* 居中显示 */
            position: relative;
            width: 296px;
            height: 48px;
            border-radius: 4px;
            cursor: pointer;
            overflow: visible;
            box-sizing: border-box;
            transform: translateZ(0); /* Prevent jitter by keeping it on a GPU layer */
            
            /* ==========================================
               动画时间中控台 (Animation Timing Control)
               ========================================== */
            --anim-duration: 1.2s;                  /* 整体切换的总时间 */
            --anim-ease: cubic-bezier(0.4, 0, 0.2, 1); /* 平滑的缓入缓出曲线，消除顿挫感 */
        }

        /* 按钮重叠布局 */
        .btn-transition-wrapper > .btn-progress,
        .btn-transition-wrapper > .btn-play {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            margin: 0;
            border: none;
        }

        /* 初始状态：安装中显示，开始游戏隐藏 */
        .btn-transition-wrapper .btn-play {
            opacity: 0;
            pointer-events: none;
        }

        /* 1. 整体容器状态 */
        .btn-transition-wrapper.is-transitioning {
            pointer-events: none; /* 动画期间禁止点击 */
        }

        /* 动画期间禁用所有默认 transition，防止与 keyframes 冲突导致重绘卡顿 */
        .btn-transition-wrapper.is-transitioning * {
            transition: none !important;
        }

        /* ==================================================
           最新方案：从上到下填充 + 内阴影辉光扩展 (Top-to-Bottom Fill + Inner Glow)
           ================================================== */
        .btn-transition-wrapper.is-transitioning .btn-progress {
            will-change: transform, clip-path;
            animation: progress-wipe-down var(--anim-duration) var(--anim-ease) forwards;
        }
        @keyframes progress-wipe-down {
            0% { clip-path: inset(-100px); }
            100% { clip-path: inset(100% -100px -100px -100px); }
        }

        /* 统一动效方案：缩短至 1.2s，回归原生 Bezier 插值确保 GPU 级别的丝滑感 */
        .btn-transition-wrapper.is-transitioning .btn-play {
            opacity: 1;
            pointer-events: none;
            will-change: transform, clip-path, box-shadow;
            animation: play-unified-container 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        .btn-transition-wrapper.is-transitioning .btn-play::before {
            content: '';
            position: absolute;
            inset: 0;
            background: #FF7210;
            z-index: 1;
            pointer-events: none;
            border-radius: 4px;
            animation: play-unified-mask 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
        }

        /* 容器层：专注物理填充与阴影沉淀
           填充：0-100% 保持极致丝滑的 Bezier 插值
           阴影：配合褪色时机，从 40% (0.48s) 就开始隐约浮现，增强立体感
        */
        @keyframes play-unified-container {
            0% { 
                clip-path: inset(-100px -100px 100% -100px); 
                box-shadow: 0px 0px 0px 0px rgba(166, 61, 5, 0), inset 0px 0px 0px 0px rgba(255, 114, 16, 0); 
            }
            40% {
                /* 阴影提前浮现，与褪色过程呼应 */
                box-shadow: 0px 2px 4px 0px rgba(166, 61, 5, 0.1), inset 0px 0px 2px 0px rgba(255, 114, 16, 0.02);
            }
            100% { 
                clip-path: inset(-100px); 
                box-shadow: 0px 8px 16px 0px rgba(166, 61, 5, 0.3), inset 0px 0px 8px 0px rgba(255, 114, 16, 0.1);
            }
        }

        /* 遮罩层：橙色褪去
           提前褪色点：从 30% (约 0.36s) 就开始淡出，在填充的中后期完成色彩转换
           这样填充动作和褪色动作在视觉中心点完美交汇，消除任何先后的断层感
        */
        @keyframes play-unified-mask {
            0% { opacity: 1; }
            30% { opacity: 1; } /* 填充初期极短时间内保持橙色，随后立即进入褪色 */
            90% { opacity: 0; } /* 在物理动作完全停止前（1.08s）就完成褪色，让最终态定格更稳 */
            100% { opacity: 0; }
        }

        /* 强制内容绝对居中，仅在过渡演示容器内生效，确保不影响全局 game_download_btn 样式 */
        .btn-transition-wrapper .btn-play__content,
        .btn-transition-wrapper .btn-progress__content {
            position: absolute !important;
            left: 50% !important;
            top: 50% !important;
            transform: translate(-50%, -50%) translateZ(0) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            gap: 6px !important;
            width: max-content !important;
            margin: 0 !important;
            will-change: transform !important;
        }

        /* ENTRY ANIMATION for Play text (开始游戏) - 彻底杀掉所有循环动效和弹性缩放 */
        .btn-play__text .char,
        .btn-play__icon {
            animation: none !important;
            opacity: 1 !important;
            transform: translateZ(0) !important;
            transition: none !important;
            color: inherit !important;
            will-change: transform !important; /* 强制保持合成层，防止结束时重绘位移 */
        }

        /* 修复 Icon 在最后一帧抖动：
           1. 强制禁止所有 transition，防止最后一帧与完成态之间产生 sub-pixel 补间
           2. 始终保持 0.5px 偏移并启用 GPU 合成层 
        */
        .btn-play__icon-wrapper {
            animation: none !important;
            opacity: 1 !important;
            transform: translateY(0.5px) translateZ(0) !important; 
            transition: none !important;
            will-change: transform !important;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            image-rendering: -webkit-optimize-contrast; /* 增强图标渲染稳定性 */
        }

        .btn-play {
            transition: none !important; /* 禁止任何可能由于 shadow/clip-path 微差导致的补间 */
        }

        /* --------------------------------------------------
           Text character stability
        -------------------------------------------------- */
        .char {
            display: inline-block;
            transition: none !important;
            letter-spacing: 0; /* 锁定字间距，防止渲染引擎在动画结束时微调 */
            -webkit-font-smoothing: antialiased;
        }

        /* 仅在“开始游戏”按钮内，强制杀掉所有波浪动效，保持静止 */
        .btn-play .char {
            animation: none !important;
            transform: translateZ(0) !important;
            opacity: 1 !important;
            color: inherit !important;
            will-change: transform !important;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
        }

        /* 安装中状态的文字：在没有过渡时，允许继承原有的 char-wave-installing */
        .btn-progress--installing .char {
            display: inline-block;
        }

        /* EXIT ANIMATION for Installing text (游戏安装中) */
        .btn-transition-wrapper.is-transitioning .btn-progress__title .char {
            /* 只有在进入过渡状态后，才强制切换到退场动画 */
            animation: char-exit 0.6s cubic-bezier(0.4, 0, 0.2, 1) forwards !important;
        }
        .btn-transition-wrapper.is-transitioning .btn-progress__title .char:nth-child(1) { animation-delay: 0.0s !important; }
        .btn-transition-wrapper.is-transitioning .btn-progress__title .char:nth-child(2) { animation-delay: 0.05s !important; }
        .btn-transition-wrapper.is-transitioning .btn-progress__title .char:nth-child(3) { animation-delay: 0.1s !important; }
        .btn-transition-wrapper.is-transitioning .btn-progress__title .char:nth-child(4) { animation-delay: 0.15s !important; }
        .btn-transition-wrapper.is-transitioning .btn-progress__title .char:nth-child(5) { animation-delay: 0.2s !important; }

        @keyframes char-exit {
            0% { transform: translateY(0); opacity: 1; }
            100% { transform: translateY(-12px); opacity: 0; }
        }

        /* ==================================================
           动画完成，彻底切换状态
           ================================================== */
        .btn-transition-wrapper.is-completed .btn-progress {
            display: none;
        }
        .btn-transition-wrapper.is-completed .btn-play {
            opacity: 1;
            pointer-events: auto;
            clip-path: inset(-100px) !important; /* 使用一个极大的 inset 代替 none，防止渲染层级切换瞬间抖动 */
        }
        .btn-transition-wrapper.is-completed * {
            transition: none !important; /* 确保切换到 completed 类时没有任何 sub-pixel 补间 */
        }
        .btn-transition-wrapper.is-completed .btn-play__text .char {
            animation: none !important;
            opacity: 1 !important;
            transform: translateZ(0) !important;
            will-change: transform !important;
        }
        .btn-transition-wrapper.is-completed .btn-play__icon-wrapper {
            animation: none !important;
            opacity: 1 !important;
            transform: translateY(0.5px) translateZ(0) !important;
            will-change: transform !important;
        }
        /* 重置按钮 - 仅用于演示 */
        .reset-btn {
            margin-top: 40px;
            background: transparent;
            border: 1px solid rgba(255,255,255,0.2);
            color: rgba(255,255,255,0.6);
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .reset-btn:hover {
            background: rgba(255,255,255,0.1);
            color: white;
        }
    </style>
</head>
<body>
    <a href="game_download_btn.html" class="back-link">← 返回组件页</a>
    
    <div class="demo-container">
        <h3 class="section-title">游戏安装 到 开始游戏的过渡动画</h3>
        <p class="section-desc">结合弹性缩放 (Spring Bounce) 与字元错落进退场的流畅过渡</p>

        <div class="btn-transition-wrapper" id="transition-demo" onclick="triggerTransition()">
            <!-- 1. 游戏安装中 (来自最新的 btn-progress 样式) -->
            <div class="btn-progress btn-progress--installing w-296" id="btn-installing">
                <div class="btn-progress__content">
                    <div class="btn-progress__text-group">
                        <span class="btn-progress__title"><span class="char" style="--i:0">游</span><span class="char" style="--i:1">戏</span><span class="char" style="--i:2">安</span><span class="char" style="--i:3">装</span><span class="char" style="--i:4">中</span></span>
                    </div>
                </div>
            </div>

            <!-- 2. 开始游戏 (来自最新的 btn-play 样式) -->
            <button class="btn-play" id="btn-play">
                <div class="btn-play__content">
                    <div class="btn-play__icon-wrapper">
                        <svg class="btn-play__icon" viewBox="0 0 15.9414 12.1621" width="100%" height="100%" preserveAspectRatio="xMidYMid meet" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path fill-rule="evenodd" clip-rule="evenodd" d="M12.7593 0C13.9749 0 14.991 0.924666 15.106 2.13477L15.9361 10.8721C16.0018 11.5639 15.4582 12.162 14.7632 12.1621H11.5874C11.1411 12.1619 10.7333 11.9099 10.5337 11.5107L9.86672 10.1777C9.76689 9.97807 9.56261 9.85156 9.33938 9.85156H6.60207C6.37884 9.85156 6.17456 9.97807 6.07473 10.1777L5.40774 11.5107C5.20807 11.9101 4.79951 12.1621 4.35305 12.1621H1.17824C0.483269 12.1621 -0.06034 11.5639 0.00539225 10.8721L0.83547 2.13477C0.950477 0.924668 1.96659 0 3.18215 0H12.7593ZM12.438 5.79199C12.0319 5.79199 11.7027 6.12128 11.7027 6.52734C11.7029 6.93324 12.0321 7.26172 12.438 7.26172C12.8439 7.26165 13.1732 6.93319 13.1734 6.52734C13.1734 6.12132 12.844 5.79206 12.438 5.79199ZM4.16652 4.64551H2.99074V5.82422H4.16652V7.00098H5.34524V5.82422H6.52199V4.64551H5.34524V3.46973H4.16652V4.64551ZM10.6743 3.58984C10.2684 3.58984 9.93911 3.91924 9.93899 4.3252C9.93899 4.73126 10.2683 5.06055 10.6743 5.06055C11.0803 5.06048 11.4097 4.73122 11.4097 4.3252C11.4096 3.91928 11.0803 3.58991 10.6743 3.58984Z" fill="url(#paint_final)" fill-opacity="0.95"/>
                            <defs>
                                <linearGradient id="paint_final" x1="3.44462" y1="0.5" x2="14.9446" y2="12.4993" gradientUnits="userSpaceOnUse">
                                    <stop stop-color="white" stop-opacity="0.95"/>
                                    <stop offset="1" stop-color="white" stop-opacity="0.85"/>
                                </linearGradient>
                            </defs>
                        </svg>
                    </div>
                    <span class="btn-play__text">
                        <span class="char">开</span><span class="char">始</span><span class="char">游</span><span class="char">戏</span>
                    </span>
                </div>
            </button>
        </div>

        <button class="reset-btn" onclick="resetTransition()">重置动画</button>
    </div>

    <script>
        const wrapper = document.getElementById('transition-demo');

        function triggerTransition() {
            // 如果已经在过渡中或已完成，则不响应
            if (wrapper.classList.contains('is-transitioning') || wrapper.classList.contains('is-completed')) {
                return;
            }

            // 1. 添加过渡类，触发所有 CSS 动画
            wrapper.classList.add('is-transitioning');

            // 2. 动画时间结束后，清理过渡类，添加完成类
            setTimeout(() => {
                wrapper.classList.remove('is-transitioning');
                wrapper.classList.add('is-completed');
                
                // 此时真正的 "开始游戏" 按钮可以被点击，它的 hover 效果也会生效
            }, 1200); // 1200ms 与 CSS 中 --anim-duration 保持绝对同步
        }

        function resetTransition() {
            // 重置类名，恢复到初始状态
            wrapper.classList.remove('is-transitioning');
            wrapper.classList.remove('is-completed');
        }
    </script>
</body>
</html>
